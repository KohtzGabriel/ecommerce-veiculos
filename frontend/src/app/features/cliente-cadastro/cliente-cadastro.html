<main class="page-shell">
  <section class="form-card" aria-labelledby="page-title">
    <header class="page-header">
      <p class="eyebrow">Cadastro de pessoas</p>
      <h1 id="page-title">Novo cliente</h1>
      <p>Informe os dados pessoais e um endereço estruturado para cadastrar o cliente.</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="cadastrar()" novalidate>
      <fieldset>
        <legend>Dados pessoais</legend>
        <div class="form-grid">
          <label>
            Nome completo
            <input type="text" formControlName="nome" autocomplete="name" [class.invalid]="!!mensagemCampo('nome')" />
            @if (mensagemCampo('nome'); as message) { <span class="field-error">{{ message }}</span> }
          </label>
          <label>
            E-mail
            <input type="email" formControlName="email" autocomplete="email" [class.invalid]="!!mensagemCampo('email')" />
            @if (mensagemCampo('email'); as message) { <span class="field-error">{{ message }}</span> }
          </label>
          <label>
            CPF
            <input type="text" formControlName="cpf" inputmode="numeric" maxlength="11" aria-describedby="cpf-help" [class.invalid]="!!mensagemCampo('cpf')" />
            <small id="cpf-help">Somente números.</small>
            @if (mensagemCampo('cpf'); as message) { <span class="field-error">{{ message }}</span> }
          </label>
          <label>
            Data de nascimento
            <input type="date" formControlName="dataNascimento" [class.invalid]="!!mensagemCampo('dataNascimento')" />
            @if (mensagemCampo('dataNascimento'); as message) { <span class="field-error">{{ message }}</span> }
          </label>
          <label>
            Gênero <span class="optional">(opcional)</span>
            <input type="text" formControlName="genero" maxlength="30" />
          </label>
        </div>
      </fieldset>

      <fieldset formGroupName="telefone">
        <legend>Telefone</legend>
        <div class="form-grid phone-grid">
          <label>
            DDD
            <input type="text" formControlName="codigoArea" inputmode="numeric" maxlength="3" [class.invalid]="!!mensagemCampo('codigoArea', form.controls.telefone)" />
            @if (mensagemCampo('codigoArea', form.controls.telefone); as message) { <span class="field-error">{{ message }}</span> }
          </label>
          <label>
            Número
            <input type="text" formControlName="numero" inputmode="tel" maxlength="15" [class.invalid]="!!mensagemCampo('numero', form.controls.telefone)" />
            @if (mensagemCampo('numero', form.controls.telefone); as message) { <span class="field-error">{{ message }}</span> }
          </label>
          <label class="checkbox-label">
            <input type="checkbox" formControlName="whatsapp" />
            WhatsApp
          </label>
        </div>
      </fieldset>

      <fieldset formGroupName="endereco">
        <legend>Endereço</legend>
        <div class="cep-row">
          <label>
            CEP
            <input type="text" formControlName="cep" placeholder="00000-000" inputmode="numeric" maxlength="9" (blur)="buscarCep()" [class.invalid]="!!mensagemCampo('cep', enderecoForm)" />
            @if (mensagemCampo('cep', enderecoForm); as message) { <span class="field-error">{{ message }}</span> }
          </label>
          <button type="button" class="secondary-button" (click)="buscarCep()" [disabled]="buscandoCep()">
            {{ buscandoCep() ? 'Consultando...' : 'Consultar CEP' }}
          </button>
        </div>
        @if (mensagemCep()) {
          <p class="cep-message" [class.success]="statusCep() === 'success'" [class.warning]="statusCep() === 'warning'" role="status">{{ mensagemCep() }}</p>
        }
        <div class="form-grid address-grid">
          <label class="wide-field">
            Logradouro
            <input type="text" formControlName="logradouro" autocomplete="street-address" [class.invalid]="!!mensagemCampo('logradouro', enderecoForm)" />
            @if (mensagemCampo('logradouro', enderecoForm); as message) { <span class="field-error">{{ message }}</span> }
          </label>
          <label>
            Número
            <input type="text" formControlName="numero" [class.invalid]="!!mensagemCampo('numero', enderecoForm)" />
            @if (mensagemCampo('numero', enderecoForm); as message) { <span class="field-error">{{ message }}</span> }
          </label>
          <label>
            Complemento <span class="optional">(opcional)</span>
            <input type="text" formControlName="complemento" />
          </label>
          <label>
            Bairro
            <input type="text" formControlName="bairro" [class.invalid]="!!mensagemCampo('bairro', enderecoForm)" />
            @if (mensagemCampo('bairro', enderecoForm); as message) { <span class="field-error">{{ message }}</span> }
          </label>
          <label>
            Município
            <select formControlName="municipioId" (change)="atualizarMunicipio(enderecoForm.controls.municipioId.value)">
              <option [ngValue]="null">Selecione o município</option>
              @for (municipio of municipios(); track municipio.id) {
                <option [ngValue]="municipio.id">{{ municipio.nome }} - {{ municipio.estado.sigla }}</option>
              }
            </select>
            <small>Se a ViaCEP estiver indisponível, selecione manualmente.</small>
            @if (enderecoForm.controls.municipioId.touched && enderecoForm.controls.municipioId.invalid) { <span class="field-error">Informe o município.</span> }
          </label>
          <label>
            Estado
            <input type="text" formControlName="estado" readonly />
          </label>
          <input type="hidden" formControlName="municipioId" />
        </div>
      </fieldset>

      @if (mensagemFormulario()) {
        <p class="form-message" role="alert">{{ mensagemFormulario() }}</p>
      }
      <button class="primary-button" type="submit" [disabled]="salvando()">
        {{ salvando() ? 'Salvando...' : 'Cadastrar cliente' }}
      </button>
    </form>
  </section>
</main>
