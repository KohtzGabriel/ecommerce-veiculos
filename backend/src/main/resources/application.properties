# configuracao do bd
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = ${DB_USERNAME:topicos2}
quarkus.datasource.password = ${DB_PASSWORD:123456}
quarkus.datasource.jdbc.url = ${DB_URL:jdbc:postgresql://localhost:5432/topicos2db}

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.flyway.migrate-at-start=false
quarkus.flyway.clean-disabled=true

# desabilitar o docker 
quarkus.devservices.enabled=false

quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# configuracao do cors
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.rest-client.viacep-api.url=https://viacep.com.br/ws
quarkus.rest-client.viacep-api.connect-timeout=2000
quarkus.rest-client.viacep-api.read-timeout=3000
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
# wildcard (*) é incompatível com allow-credentials=true — listar explicitamente
quarkus.http.cors.exposed-headers=Authorization, Content-Disposition, X-Page, X-Page-Size, X-Total-Count
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# base url para o type em exception
%dev.problem.base-url=http://localhost:8080
%test.problem.base-url=http://localhost:8080
%prod.problem.base-url=${PROBLEM_BASE_URL}

# configuracao do jwt 
mp.jwt.verify.issuer=${JWT_ISSUER:unitins-jwt}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}
%prod.mp.jwt.verify.issuer=${JWT_ISSUER}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}


